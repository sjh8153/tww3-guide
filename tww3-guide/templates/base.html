<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e0f12">
  <title>{% block title %}TWW3 개인 공략 위키{% endblock %}</title>
  <link rel="stylesheet" href="{{ '../' if article else '' }}static/style.css">
  <script defer src="{{ '../' if article else '' }}static/app.js"></script>
</head>
<body data-root="{{ '../' if article else '' }}">
<header class="topbar">
  <a class="brand" href="{{ '../' if article else '' }}index.html"><span class="brand-mark">III</span><span><b>TWW3</b><small>개인 공략 위키</small></span></a>
  <button class="search-trigger" data-search-open aria-label="검색 열기">⌕ <span>검색</span><kbd>/</kbd></button>
  <button class="mobile-nav" data-nav-toggle aria-label="메뉴 열기">☰</button>
</header>
<div class="shell">
  <aside class="sidebar" data-sidebar>
    <nav>
      <a href="{{ '../' if article else '' }}index.html" class="nav-home">⌂ 전체 홈</a>
      {% for key, faction in factions.items() %}
      <section class="nav-faction">
        <a class="nav-faction-title" href="{{ '../' if article else '' }}{{ key }}.html"><span class="sigil">{{ faction.icon }}</span>{{ faction.short }}</a>
        <div class="nav-links">
          {% for a in articles|default([]) if a.faction == key %}
          <a href="{{ '../' if article else '' }}{{ a.url }}" {% if article and a.slug == article.slug %}class="active"{% endif %}>{{ a.label }}</a>
          {% endfor %}
        </div>
      </section>
      {% endfor %}
    </nav>
    <div class="sidebar-foot">Markdown 기반 · 마지막 빌드 {{ today }}</div>
  </aside>
  <main class="main">{% block content %}{% endblock %}</main>
</div>

<div class="search-modal" data-search-modal hidden>
  <div class="search-panel">
    <div class="search-head">
      <input data-search-input type="search" placeholder="루앙, 사이클 차지, 옥전사…" autocomplete="off">
      <button data-search-close aria-label="검색 닫기">✕</button>
    </div>
    <div class="search-hint">제목·본문·소제목 전체 검색 · <kbd>Esc</kbd> 닫기</div>
    <div class="search-results" data-search-results></div>
  </div>
</div>
</body>
</html>
